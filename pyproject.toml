[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cenekathon-staging"
version = "0.1.0"
description = "DuckDB staging and import audit log for Skill Market parser output"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5.6,<3", "pytz>=2024.1", "pandas>=2,<4"]

[project.optional-dependencies]
chat = ["anthropic>=0.40,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
skillmarket-staging = "skillmarket_staging.cli:main"

[tool.setuptools.packages.find]
include = ["skillmarket_staging*", "visualization*"]

[tool.setuptools.package-data]
skillmarket_staging = ["sql/*.sql", "demo/*.json"]
visualization = ["stub/*.csv", "dashboard.html"]
